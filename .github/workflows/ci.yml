name: replay-and-paper
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source manifest
        run: sha256sum -c MANIFEST.sha256
      - name: Supplement pins
        working-directory: replay
        run: sha256sum -c SHA256SUMS
      - name: Install pinned replay dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.5 mpmath==1.4.1
      - name: Exact replays and five mutants
        working-directory: replay
        run: |
          if grep -nE '^(import|from) +(scipy|sympy)' run_all.py replay.py mutants.py; then
            echo "the replay scripts must import only numpy and mpmath"; exit 1
          fi
          python -B run_all.py
      - name: Pin the auxiliary toolchain
        # sympy 1.14.0 requires mpmath<1.4, so it cannot share the environment that
        # reruns the replays at the verified mpmath 1.4.1. The two pins are checked
        # together in a separate environment; the replay scripts do not import them.
        run: |
          python -m venv /tmp/aux
          /tmp/aux/bin/python -m pip install --disable-pip-version-check scipy==1.18.1 sympy==1.14.0
          /tmp/aux/bin/python -c "import mpmath, scipy, sympy; print('scipy', scipy.__version__, 'sympy', sympy.__version__, 'mpmath', mpmath.__version__)"
      - name: Check prose punctuation
        run: |
          if grep -nP '\x{2014}' README.md CITATION.cff BUILD.md replay/README.md; then exit 1; fi
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Tectonic and poppler
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
          tectonic --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build the manuscript
        working-directory: paper
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=1795132800 tectonic -X compile --keep-logs main.tex
          if grep -nE 'Overfull|Undefined|Citation.*undefined|LaTeX Warning|Package .* Warning' main.log; then exit 1; fi
          test -s main.pdf
          pdfinfo -url main.pdf > urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24428099' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24428101' urls.txt
          grep -qF 'https://orcid.org/0000-0001-5839-5197' urls.txt
          pdfinfo main.pdf | grep -qE '^Pages:[[:space:]]+24$'
          echo "underfull boxes: $(grep -c 'Underfull' main.log || true)"
      - uses: actions/upload-artifact@v4
        with:
          name: penson-kolb-pair-odlro-paper
          path: paper/main.pdf
          if-no-files-found: error
